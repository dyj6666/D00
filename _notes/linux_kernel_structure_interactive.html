<!DOCTYPE html>

<title>Linux 内核知识结构图（全量版）</title>
<style>
:root { --bg:#121418; --card:#1d2126; --border:#2a3038; --border2:#333b46; --text:#e8edf3; --dim:#93a0b0; --accent:#4f8cff; }
* { box-sizing: border-box; }
body { margin:0; font-family:"Microsoft YaHei","PingFang SC",sans-serif; color:var(--text);
  background:radial-gradient(1100px 500px at 50% -8%, #1c2740 0%, var(--bg) 55%); min-height:100vh; }
header { position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:12px; padding:11px 26px;
  background:rgba(18,20,24,.85); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); flex-wrap:wrap; }
header .logo { font-size:21px; font-weight:800; background:linear-gradient(90deg,#7ab8ff,#e8edf3);
  -webkit-background-clip:text; background-clip:text; color:transparent; white-space:nowrap; }
header .crumb { color:var(--dim); font-size:13px; }
header .crumb a { color:var(--accent); text-decoration:none; cursor:pointer; }
header .crumb b { color:var(--text); }
header .spacer { flex:1; }
.btn { border:1px solid var(--border2); background:#242a32; color:var(--text); border-radius:10px; padding:7px 15px;
  font-size:13px; cursor:pointer; transition:all .15s; white-space:nowrap; }
.btn:hover { background:#2d3540; border-color:var(--accent); color:#fff; }
.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
.btn.primary:hover { filter:brightness(1.12); }
.btn.gold { border-color:#8a6d1f; color:#f0d98c; }
main { max-width:1720px; margin:0 auto; padding:20px 24px 40px; }
.hero { text-align:center; margin:6px 0 18px; }
.hero h1 { margin:0; font-size:33px; font-weight:800; letter-spacing:1px;
  background:linear-gradient(90deg,#7ab8ff 0%,#b8d8ff 45%,#e8edf3 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
.hero p { margin:8px 0 0; color:var(--dim); font-size:14px; }
.stats { display:flex; gap:10px; justify-content:center; margin:14px 0 4px; flex-wrap:wrap; }
.stat { background:var(--card); border:1px solid var(--border); border-radius:999px; padding:5px 16px; font-size:12.5px; color:var(--dim); }
.stat b { color:var(--accent); }
.legend { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:12px 0 16px; }
.chip { display:inline-flex; align-items:center; gap:7px; background:var(--card); border:1px solid var(--border);
  border-radius:999px; padding:5px 13px; font-size:12.5px; color:var(--dim); cursor:pointer; transition:all .15s; user-select:none; }
.chip:hover { border-color:var(--accent); color:var(--text); transform:translateY(-1px); }
.chip i { width:10px; height:10px; border-radius:3px; display:inline-block; }
.card { background:var(--card); border:1px solid var(--border); border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.35); padding:16px; }
.stage { position:relative; overflow:hidden; border:1px solid var(--border); border-radius:10px; background:#15181c; cursor:grab; height:76vh; }
.stage.dragging { cursor:grabbing; }
.inner { transform-origin:0 0; }
.inner svg { display:block; max-width:none; }
.cbox { cursor:pointer; transition:filter .15s; }
.cbox:hover { filter:brightness(1.22) drop-shadow(0 0 10px rgba(120,180,255,.35)); }
.note-btn { cursor:pointer; }
.note-btn:hover text { fill:#ffffff; }
.drawer { position:fixed; top:0; right:0; width:460px; max-width:94vw; height:100vh; z-index:200;
  background:#171b20; border-left:1px solid #2c333d; box-shadow:-14px 0 44px rgba(0,0,0,.55);
  transform:translateX(105%); transition:transform .22s ease; display:flex; flex-direction:column; }
.drawer.open { transform:translateX(0); }
.drawer-head { display:flex; align-items:center; justify-content:space-between; padding:14px 18px;
  border-bottom:1px solid #2c333d; background:#1a1e24; }
.drawer-head b { color:#7ab8ff; font-size:16px; }
.drawer-head button { background:none; border:none; color:#93a0b0; font-size:18px; cursor:pointer; padding:4px 8px; }
.drawer-head button:hover { color:#fff; }
#d-body { padding:16px 18px; overflow-y:auto; flex:1; font-size:14px; line-height:1.75; }
.ndet { color:#93a0b0; margin-bottom:10px; }
.ncode { background:#121418; border:1px solid #2c333d; border-radius:8px; padding:10px 12px; color:#f0d98c;
  font-family:Consolas,monospace; font-size:12.5px; overflow-x:auto; white-space:pre-wrap; margin:8px 0; }
.ntext { color:#e8edf3; }
.nsec { color:#9fc3ff; font-weight:700; margin:14px 0 6px; font-size:13px; }
.nlink { display:block; color:#7ab8ff; text-decoration:none; padding:7px 12px; margin:5px 0;
  background:#242a32; border:1px solid #2c333d; border-radius:8px; font-size:13px; }
.nlink:hover { border-color:#4f8cff; background:#2a323d; }
footer { text-align:center; color:#5d6875; font-size:12px; margin:24px 0 8px; }
.subview, #view-overview { animation:fadein .18s ease; }
@keyframes fadein { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
</style>

    if (r.width === 0 || r.height === 0) { stage._needFit = true; return; }
    stage._needFit = false;
    var s = Math.min(r.width / svgW, r.height / svgH, 1);
    scale = s; tx = (r.width - svgW * s) / 2; ty = (r.height - svgH * s) / 2; apply();
  };
  stage.addEventListener('wheel', function(e){
    e.preventDefault();
    var r = stage.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.15 : 1/1.15);
  }, { passive: false });
  var drag = null;
  stage.addEventListener('mousedown', function(e){
    drag = { x: e.clientX, y: e.clientY, tx: tx, ty: ty };
    stage.classList.add('dragging'); e.preventDefault();
  });
  window.addEventListener('mousemove', function(e){
    if (!drag) return;
    tx = drag.tx + e.clientX - drag.x; ty = drag.ty + e.clientY - drag.y; apply();
  });
  window.addEventListener('mouseup', function(){ drag = null; stage.classList.remove('dragging'); });
  stage.fit();
  return stage;
}

var NOTES = {"n_container_of": {"text": "container_of 是内核第一宏：给定结构体成员的指针，反推出宿主结构体的指针，实现\"嵌入容器\"设计。原理 = (char*)ptr - offsetof(type, member)，配合 __same_type 做编译期类型检查。理解它 = 理解内核所有链表/树/哈希的实现基础。", "links": [["源码实现(带行号)", "https://codebrowser.dev/linux/linux/include/linux/container_of.h.html#19"], ["LWN 内核数据结构系列(经典)", "https://lwn.net/Articles/337089/"]]}, "n_list": {"text": "list_head 是双向循环链表：空表自指、永不为 NULL，插入删除 O(1)。关键是\"嵌入\"——对象内嵌 struct list_head 成员，用 container_of 反推宿主。遍历用 list_for_each_entry，遍历中删除必须用 *_safe 版本。", "links": [["LWN: 内核链表入门(经典)", "https://lwn.net/Articles/337089/"], ["list.h 全部 API", "https://elixir.bootlin.com/linux/latest/source/include/linux/list.h"]]}, "n_kfifo": {"text": "kfifo 是无锁环形缓冲：只支持单生产者单消费者，读写各维护一个 index 即可免锁。内核用它做串口缓冲等场景。超过一对多就要加锁或换结构。", "links": [["kfifo.h 源码", "https://elixir.bootlin.com/linux/latest/source/include/linux/kfifo.h"], ["内核 API 文档", "https://docs.kernel.org/core-api/kernel-api.html"]]}, "n_rbtree": {"text": "红黑树保证插入/删除/查找 O(log n)，内核用于调度队列、VMA 区间、定时器等。学习重点是旋转与着色规则，建议对照 lib/rbtree.c 阅读（rb_insert_color/rb_erase）。", "links": [["内核 rbtree 文档", "https://docs.kernel.org/core-api/rbtree.html"], ["rbtree.c 实现", "https://elixir.bootlin.com/linux/latest/source/lib/rbtree.c"]]}, "n_xarray": {"text": "xarray 是稀疏数组/基数树的现代实现，取代了 radix tree。页缓存、文件偏移索引都在用它。API 以 xa_ 开头（xa_store/xa_load），支持 RCU 无锁读。", "links": [["LWN: xarray 简史", "https://lwn.net/Articles/745958/"], ["xarray 官方文档", "https://docs.kernel.org/core-api/xarray.html"]]}, "n_rhashtable": {"text": "rhashtable 是内核哈希表标配：动态扩容、无锁读（RCU）、链式冲突。网络栈路由/连接表都在用。需要关心哈希函数选择（jhash）与扩容时的遍历语义。", "links": [["rhashtable.c 实现", "https://elixir.bootlin.com/linux/latest/source/lib/rhashtable.c"], ["内核 API 文档", "https://docs.kernel.org/core-api/kernel-api.html"]]}, "n_gfp": {"text": "GFP 标志决定分配行为：GFP_KERNEL 可睡眠（仅进程上下文），GFP_ATOMIC 原子上下文不睡眠，GFP_NOWAIT 不睡眠不回收。选错标志轻则警告、重则死锁；分配结果必须检查 NULL。", "links": [["内存分配指南(官方)", "https://docs.kernel.org/core-api/memory-allocation.html"], ["gfp_types.h 标志定义", "https://elixir.bootlin.com/linux/latest/source/include/linux/gfp_types.h"]]}, "n_kref": {"text": "kref 是引用计数生命周期管理：kref_get 增加引用，kref_put 减到 0 时调用 release 回调。铁律：谁拿引用谁负责归还，防止 use-after-free；引用计数与锁要配合设计。", "links": [["kref 官方文档", "https://docs.kernel.org/core-api/kref.html"], ["kref.h 源码", "https://elixir.bootlin.com/linux/latest/source/include/linux/kref.h"]]}, "n_printk": {"text": "printk 是内核日志输出：支持级别（KERN_ERR/INFO/DEBUG）与格式扩展（%pK 指针脱敏、%pa 物理地址、%pS 符号化）。生产环境用动态调试（dynamic_debug）控制开关，避免刷屏。", "links": [["printk 基础文档", "https://docs.kernel.org/core-api/printk-basics.html"], ["printk.c 实现", "https://elixir.bootlin.com/linux/latest/source/kernel/printk/printk.c"]]}, "n_spinlock": {"text": "自旋锁忙等不睡眠，只适合极短临界区；持有期间禁止调用任何可能睡眠的函数（包括 kmalloc(GFP_KERNEL)）。中断上下文要用 spin_lock_irqsave/spin_unlock_irqrestore 保存中断状态。", "links": [["自旋锁官方文档", "https://docs.kernel.org/locking/spinlocks.html"], ["spinlock.h 源码", "https://elixir.bootlin.com/linux/latest/source/include/linux/spinlock.h"]]}, "n_mutex": {"text": "mutex 可睡眠，是进程上下文默认选择；自带优先级继承防止优先级反转。临界区长、可能睡眠（如等 IO）时用它。与自旋锁的选择：临界区多短、会不会睡眠。", "links": [["mutex 设计文档", "https://docs.kernel.org/locking/mutex-design.html"], ["mutex.c 实现", "https://elixir.bootlin.com/linux/latest/source/kernel/locking/mutex.c"]]}, "n_barrier": {"text": "内存屏障解决编译器/CPU 重排导致的可见性问题：barrier() 只挡编译器，smp_mb/rmb/wmb 挡 CPU。实践纪律：优先用锁和 READ_ONCE/WRITE_ONCE，别手写屏障——除非你真懂内存模型。", "links": [["内存屏障权威文档", "https://docs.kernel.org/memory-barriers.html"], ["barrier.h 源码", "https://elixir.bootlin.com/linux/latest/source/include/linux/barrier.h"]]}, "n_rcu": {"text": "RCU：读侧无锁、无原子操作、无屏障；写侧\"复制-修改-替换\"，等待宽限期（所有旧读者退出）后才释放旧数据。读多写少的场景（路由表、dcache）首选。经典文章：Paul McKenney 的 What is RCU。", "links": [["What is RCU(官方)", "https://docs.kernel.org/RCU/whatisRCU.html"], ["LWN: RCU 是什么(必读)", "https://lwn.net/Articles/262464/"]]}, "n_eevdf": {"text": "EEVDF（6.6+）取代 CFS：按虚拟运行时间在红黑树中取最左节点调度，引入延迟界限（lag）保证公平与低延迟。核心函数 pick_eevdf 在 kernel/sched/fair.c。面试高频：CFS 与 EEVDF 的区别。", "links": [["EEVDF 官方文档", "https://docs.kernel.org/scheduler/sched-eevdf.html"], ["Linux Magazine: A Fair Slice", "https://www.linux-magazine.com/Online/Features/EEVDF#1"]]}, "n_warn": {"text": "WARN_ON 打印警告+调用栈但不停止系统，用于\"理论上不该发生\"的路径；BUG_ON 直接崩溃（内核认为继续运行更危险）。用 WARN_ON_ONCE 防刷屏。写代码时用 WARN 不用 BUG。", "links": [["bug.h 源码", "https://elixir.bootlin.com/linux/latest/source/include/asm-generic/bug.h"], ["内核编码风格", "https://docs.kernel.org/process/coding-style.html"]]}, "n_lockdep": {"text": "lockdep 在运行时验证锁序：检测死锁、重复加锁、锁与上下文不匹配（如原子上下文睡眠）。开发期务必开启，能提前暴露 90% 的锁问题。看到 lockdep 报错先别慌，读调用链。", "links": [["lockdep 设计文档", "https://docs.kernel.org/locking/lockdep-design.html"], ["lockdep.c 源码", "https://elixir.bootlin.com/linux/latest/source/kernel/locking/lockdep.c"]]}, "n_kasan": {"text": "KASAN 编译期插桩，检测越界访问与 use-after-free，开发期利器（生产期开销大）。开启 CONFIG_KASAN 重新编译内核即可，崩在 KASAN 报告处就是 bug 现场。", "links": [["KASAN 官方文档", "https://docs.kernel.org/dev-tools/kasan.html"], ["调试工具总览", "https://docs.kernel.org/dev-tools/index.html"]]}, "n_module": {"text": "模块 = 可动态加载的内核代码：module_init/module_exit 注册入口，obj-m += 编译，insmod 装载、dmesg 验证、rmmod 卸载。LDD3（Linux Device Drivers 第三版）网上免费，是驱动入门圣经。", "links": [["内核模块构建文档", "https://docs.kernel.org/kbuild/modules.html"], ["LDD3 免费全书", "https://lwn.net/Kernel/LDD3/"]]}, "n_vfs": {"text": "VFS 是文件系统抽象层：super_block（文件系统实例）、inode（元数据）、dentry（路径组件）、file（打开实例）。所有文件系统实现这四件套的接口回调，路径解析是热点路径（dcache 缓存）。", "links": [["VFS 官方文档", "https://docs.kernel.org/filesystems/vfs.html"], ["namei.c 路径解析", "https://elixir.bootlin.com/linux/latest/source/fs/namei.c"]]}, "n_io_uring": {"text": "io_uring 用共享环形队列提交/收割 IO：SQE 提交请求、CQE 收割完成，免系统调用+免锁，吞吐碾压 epoll。现代存储/网络高性能应用标配。面试高频：io_uring vs epoll。", "links": [["io_uring 官方文档", "https://docs.kernel.org/io_uring/"], ["io_uring.c 源码", "https://elixir.bootlin.com/linux/latest/source/io_uring/io_uring.c"]]}, "n_bpf": {"text": "eBPF 允许在内核安全执行用户程序：观测（trace）、网络（XDP/TC）、安全（LSM）。BTF 提供类型信息。bpftrace 是上手最快的入口（一行脚本看系统调用）。内核开发者必学技能。", "links": [["BPF 官方文档", "https://docs.kernel.org/bpf/"], ["BCC/bpftrace 项目", "https://github.com/iovisor/bpftrace"]]}, "n_buddy": {"text": "伙伴系统按 2^order 页块管理物理内存：分配大块分裂、释放小块合并。per-CPU 页池加速热路径，迁移类型分组 + compaction 缓解碎片。理解它 = 理解物理内存管理的地基。", "links": [["内存管理文档", "https://docs.kernel.org/mm/index.html"], ["page_alloc.c 实现", "https://elixir.bootlin.com/linux/latest/source/mm/page_alloc.c"]]}, "n_bili": {"title": "🎬 视频资源", "text": "中文视频资源（B站）：① 3小时精通Linux内核（官方授权）② Linux内核实战教程 ③ 内核与内存调优保姆级教程。适合通勤/碎片时间建立整体感，系统性学习仍以文档+源码为主。", "links": [["3小时精通Linux内核", "https://www.bilibili.com/video/BV1e3cwz2Ewg/"], ["Linux内核实战教程", "https://www.bilibili.com/video/BV1U1UfBiEPr/"], ["内核与内存调优", "https://www.bilibili.com/video/BV1Xbp2zbEWE/"]]}};
